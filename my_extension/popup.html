<!DOCTYPE html>
<html lang="en">
<head>
  <title>PhishGuard Analysis</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 400px; 
      font-family: Arial, sans-serif; 
      padding: 15px; 
      background: #f5f5f5;
    }
    .header { 
      color: #d9534f; 
      font-weight: bold; 
      border-bottom: 2px solid #d9534f; 
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    #result { 
      margin-top: 10px; 
      white-space: pre-wrap; 
      font-size: 0.9em; 
      background: white; 
      padding: 10px; 
      border: 1px solid #ddd;
      border-radius: 4px;
      max-height: 300px;
      overflow-y: auto;
    }
    .loading { color: #666; font-style: italic; }
    .error { color: #d9534f; }
    .success { color: #5cb85c; }
  </style>
</head>
<body>
  <div class="header">🛡️ PhishGuard Analysis</div>
  <div id="result" class="loading">Click an email in Gmail to see the AI analysis here...</div>
  <script src="popup.js"></script>
</body>
</html>
